x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-mpm-bms-review}-backend:local
  build:
    context: .
    dockerfile: docker/DockerfileBackendDev
  working_dir: /var/www/html
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  entrypoint: []
  stop_signal: SIGTERM
  env_file: ./dev/.env.micropowermanager-backend
  environment:
    HOME: /tmp
    DB_HOST: mysql
    DB_PORT: 3306
    REDIS_HOST: redis
    QUEUE_DRIVER: redis
    MPM_LOAD_DEMO_DATA: "false"
    TELESCOPE_ENABLED: "false"
    APP_URL: http://localhost:${BMS_BACKEND_PORT:-18000}
    MPM_FRONTEND_URL: http://localhost:${BMS_FRONTEND_PORT:-18001}
  volumes:
    - ./src/backend:/var/www/html
    - backend_vendor:/var/www/html/vendor
    - backend_storage:/var/www/html/storage
    - backend_cache:/var/www/html/bootstrap/cache

services:
  prepare:
    <<: *backend
    user: "0:0"
    environment:
      LOCAL_UID: ${LOCAL_UID:-1000}
      LOCAL_GID: ${LOCAL_GID:-1000}
    command:
      - sh
      - -ec
      - |
        mkdir -p storage/app/private storage/app/public storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
        chown -R "$$LOCAL_UID:$$LOCAL_GID" vendor storage bootstrap/cache
    profiles: [initialize]

  dependencies:
    <<: *backend
    command: [composer, install, --no-interaction, --prefer-dist]
    mem_limit: 768m
    profiles: [initialize]

  backend:
    <<: *backend
    command: [php, artisan, serve, --host=0.0.0.0, --port=8000, --no-reload]
    ports:
      - "127.0.0.1:${BMS_BACKEND_PORT:-18000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8000/up]
      interval: 20s
      timeout: 5s
      retries: 5

  horizon:
    <<: *backend
    command: [php, artisan, horizon]
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 512m
    stop_grace_period: 60s

  frontend:
    build:
      context: .
      dockerfile: docker/DockerfileFrontendDev
    working_dir: /app
    entrypoint: []
    command: [npm, run, serve]
    environment:
      MPM_ENV: development
      MPM_BACKEND_URL: http://localhost:${BMS_BACKEND_PORT:-18000}
      NODE_OPTIONS: --max-old-space-size=1024
    ports:
      - "127.0.0.1:${BMS_FRONTEND_PORT:-18001}:8080"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
    mem_limit: 1400m

  mysql:
    image: mysql:8.4
    env_file: ./dev/.env.mysql
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backend_vendor:
  backend_storage:
  backend_cache:
  frontend_node_modules:
  mysql_data:
  redis_data:
